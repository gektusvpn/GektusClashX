name: recover v0.5.3 release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/recover-v0.5.3.yaml"

permissions:
  actions: read
  contents: write

env:
  RELEASE_TAG: v0.5.3
  SOURCE_RUN_ID: "35273872593"
  IS_STABLE: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    if: "${{ github.event.head_commit.message == 'ci(release): recover version 0.5.3' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download existing release artifacts
        uses: actions/download-artifact@v6
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          pattern: artifact-*
          path: ./dist
          merge-multiple: true

      - name: Generate release metadata
        run: |
          awk -v heading="## $RELEASE_TAG" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release.md

          if ! grep -q '[^[:space:]]' release.md; then
            echo "No changelog section found for $RELEASE_TAG." >&2
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          sed "s|VERSION|$version|g" .github/release_template.md >> release.md

          while IFS= read -r -d '' file; do
            sha256sum "$file" > "${file}.sha256"
          done < <(find ./dist -type f -not -name '*.sha256' -print0)

      - name: Generate update manifest
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.parse import quote

          tag = os.environ["RELEASE_TAG"]
          repository = os.environ["RELEASE_REPOSITORY"]
          base_url = f"https://github.com/{repository}/releases/download/{quote(tag, safe='')}"
          assets = []
          for artifact in sorted(Path("dist").glob("GektusClashX-*")):
              if not artifact.is_file() or artifact.name.endswith(".sha256"):
                  continue
              with artifact.open("rb") as stream:
                  digest = hashlib.file_digest(stream, "sha256").hexdigest()
              assets.append({
                  "name": artifact.name,
                  "browser_download_url": f"{base_url}/{quote(artifact.name)}",
                  "digest": f"sha256:{digest}",
                  "size": artifact.stat().st_size,
              })

          manifest = {
              "tag_name": tag,
              "body": Path("release.md").read_text(encoding="utf-8"),
              "assets": assets,
          }
          Path("dist/update.json").write_text(
              json.dumps(manifest, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8",
          )
          PY

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_NOTES_FILE: ./release.md
          RELEASE_ASSET_DIR: ./dist
        run: bash .github/scripts/publish_release.sh

      - name: Prepare Telegram notification
        if: vars.SEND_TELEGRAM == 'true'
        id: prepare_commits
        run: |
          main_commit=$(git log -1 --pretty=format:"%s" "$RELEASE_TAG")
          other_commits=$(head -n 20 release.md | grep "^- " | grep -v "^- ${main_commit}$" | head -n 9)
          commits="• ${main_commit}"
          if [ -n "$other_commits" ]; then
            commits="${commits}"$'\n'"${other_commits}"
          fi
          commits_escaped=$(echo "$commits" | jq -Rs .)
          echo "commits=$commits_escaped" >> "$GITHUB_OUTPUT"

      - name: Send Telegram notification
        if: vars.SEND_TELEGRAM == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERSION: ${{ env.RELEASE_TAG }}
          COMMITS: ${{ fromJSON(steps.prepare_commits.outputs.commits) }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ env.RELEASE_TAG }}
          IS_STABLE: ${{ env.IS_STABLE }}
        run: |
          python3 -m pip install requests --quiet
          python3 .github/scripts/notify_telegram.py
