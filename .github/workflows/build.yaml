name: build

on:
  push:
    tags:
      - "v*"
env:
  IS_STABLE: ${{ !contains(github.ref, '-') }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
      ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      ANDROID_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate release configuration
        shell: bash
        run: |
          pubspec_version=$(sed -nE 's/^version: ([^+]+).*/\1/p' pubspec.yaml)
          case "$GITHUB_REF_NAME" in
            "v$pubspec_version"|"v$pubspec_version-"*) ;;
            *)
              echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $pubspec_version."
              exit 1
              ;;
          esac

          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || \
             [ -z "$ANDROID_KEY_ALIAS" ] || \
             [ -z "$ANDROID_STORE_PASSWORD" ] || \
             [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Android signing secrets are incomplete. Configure KEYSTORE, KEY_ALIAS, STORE_PASSWORD, and KEY_PASSWORD."
            exit 1
          fi

  build:
    needs: [validate]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
            arch: amd64
          - platform: linux
            os: ubuntu-24.04
            arch: amd64
          - platform: windows
            os: windows-11-arm
            arch: arm64
          - platform: linux
            os: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Setup Rust for Windows ARM64
        if: startsWith(matrix.os, 'windows-11-arm')
        run: |
          Invoke-WebRequest -Uri "https://win.rustup.rs/aarch64" -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain stable
          $cargoPath = "$env:USERPROFILE\.cargo\bin"
          Add-Content $env:GITHUB_PATH $cargoPath
      
      - name: Setup Rust ARM64 target for cross-compilation
        if: matrix.platform == 'windows' && matrix.arch == 'arm64' && !startsWith(matrix.os, 'windows-11-arm')
        run: rustup target add aarch64-pc-windows-msvc

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Android Signing
        if: matrix.platform == 'android'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || \
             [ -z "$ANDROID_KEY_ALIAS" ] || \
             [ -z "$ANDROID_STORE_PASSWORD" ] || \
             [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Android signing secrets are incomplete. Configure KEYSTORE, KEY_ALIAS, STORE_PASSWORD, and KEY_PASSWORD."
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
          keytool -list \
            -keystore android/app/keystore.jks \
            -storepass "$ANDROID_STORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null
          {
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storePassword=$ANDROID_STORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } >> android/local.properties

      - name: Setup Firebase Config
        if: startsWith(matrix.platform,'android')
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
          fi

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache-dependency-path: |
            core/go.sum

      - name: Setup Flutter (ARM)
        if: startsWith(matrix.os, 'windows-11-arm') || startsWith(matrix.os, 'ubuntu-24.04-arm')
        uses: subosito/flutter-action@v2
        with:
          channel: "master"
          cache: true

      - name: Setup Flutter
        if: ${{ !(startsWith(matrix.os, 'windows-11-arm') || startsWith(matrix.os, 'ubuntu-24.04-arm')) }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          cache: true

      - run: flutter --version

      - name: Get Flutter Dependency
        run: flutter pub get

      - name: Setup Inno Setup
        if: matrix.platform == 'windows'
        run: |
          choco install innosetup -y
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup
        run: dart setup.dart ${{ matrix.platform }} ${{ matrix.arch && format('--arch {0}', matrix.arch) }} ${{ env.IS_STABLE == 'true' && '--env stable' || '' }}

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: artifact-${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) }}
          path: ./dist
          overwrite: true

  upload:
    permissions:
      contents: write
    needs: [build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download Android artifacts
        uses: actions/download-artifact@v6
        with:
          path: ./dist/
          name: artifact-android

      - name: Download Windows artifacts
        uses: actions/download-artifact@v6
        with:
          path: ./dist/
          pattern: artifact-windows-*
          merge-multiple: true

      - name: Download Linux artifacts
        uses: actions/download-artifact@v6
        with:
          path: ./dist/
          pattern: artifact-linux-*
          merge-multiple: true

      - name: Generate release.md
        run: |
          current_tag="${{ github.ref_name }}"

          # Prefer the curated section for this version. This keeps release
          # notes user-facing and independent from GitHub API availability.
          awk -v heading="## $current_tag" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release.md

          # Pre-releases may not have a dedicated changelog section. Fall back
          # to commit subjects since the nearest preceding tag in local Git.
          if ! grep -q '[^[:space:]]' release.md; then
            previous_tag=$(git describe --tags --abbrev=0 "${current_tag}^" 2>/dev/null || true)
            if [ -n "$previous_tag" ]; then
              range="$previous_tag..$current_tag"
            else
              range="$current_tag"
            fi
            git log --no-merges --pretty=format:'- %s' "$range" \
              | awk '!/^- chore\(release\): prepare version / { print }' \
              > release.md
            echo "" >> release.md
          fi

      - name: Patch release.md
        run: |
          version=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          if [ "${{ env.IS_STABLE }}" == "true" ]; then
            sed "s|VERSION|$version|g" ./.github/release_template.md >> release.md
          else
            sed "s|VERSION|$version|g" ./.github/pre_release_template.md >> release.md
          fi

      - name: Generate sha256
        if: env.IS_STABLE == 'true'
        run: |
          cd ./dist
          for file in $(find . -type f -not -name "*.sha256"); do
            sha256sum "$file" > "${file}.sha256"
          done

      - name: Generate update manifest
        if: env.IS_STABLE == 'true'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.parse import quote

          tag = os.environ["RELEASE_TAG"]
          repository = os.environ["RELEASE_REPOSITORY"]
          base_url = f"https://github.com/{repository}/releases/download/{quote(tag, safe='')}"
          assets = []
          for artifact in sorted(Path("dist").glob("GektusClashX-*")):
              if not artifact.is_file() or artifact.name.endswith(".sha256"):
                  continue
              with artifact.open("rb") as stream:
                  digest = hashlib.file_digest(stream, "sha256").hexdigest()
              assets.append({
                  "name": artifact.name,
                  "browser_download_url": f"{base_url}/{quote(artifact.name)}",
                  "digest": f"sha256:{digest}",
                  "size": artifact.stat().st_size,
              })

          manifest = {
              "tag_name": tag,
              "body": Path("release.md").read_text(encoding="utf-8"),
              "assets": assets,
          }
          Path("dist/update.json").write_text(
              json.dumps(manifest, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8",
          )
          PY

      - name: Release (Stable)
        if: ${{ env.IS_STABLE == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*
          body_path: "./release.md"
          prerelease: false

      - name: Release (Pre-release)
        if: ${{ env.IS_STABLE != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*
          body_path: "./release.md"
          prerelease: true

      - name: Upload release notes for notification
        uses: actions/upload-artifact@v6
        with:
          name: release-notes
          path: release.md
          retention-days: 1

  aur-publish:
    needs: [upload]
    if: vars.PUBLISH_AUR == 'true' && needs.upload.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH for AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config << 'SSHEOF'
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            User aur
          SSHEOF

      - name: Parse release tag
        id: release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" =~ ^([0-9.]+)-pre\.([0-9]+)$ ]]; then
            echo "pkgver=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "pkgrel=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
            echo "aur_pkg=gektusclashx-git" >> "$GITHUB_OUTPUT"
          else
            echo "pkgver=$VERSION" >> "$GITHUB_OUTPUT"
            echo "pkgrel=1" >> "$GITHUB_OUTPUT"
            echo "aur_pkg=gektusclashx-bin" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone AUR repository
        run: git clone ssh://aur@aur.archlinux.org/${{ steps.release.outputs.aur_pkg }}.git /tmp/aur-pkg

      - name: Download release assets and compute checksums
        id: checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/aur-assets

          gh release download "$GITHUB_REF_NAME" \
            -p "GektusClashX-linux-amd64.deb" \
            -D /tmp/aur-assets \
            -R "$GITHUB_REPOSITORY"
          echo "sha_x86=$(sha256sum /tmp/aur-assets/GektusClashX-linux-amd64.deb | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

          if gh release download "$GITHUB_REF_NAME" \
            -p "GektusClashX-linux-arm64.deb" \
            -D /tmp/aur-assets \
            -R "$GITHUB_REPOSITORY" 2>/dev/null; then
            echo "sha_arm=$(sha256sum /tmp/aur-assets/GektusClashX-linux-arm64.deb | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
            echo "has_arm=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_arm=false" >> "$GITHUB_OUTPUT"
          fi

          rm -rf /tmp/aur-assets

      - name: Update PKGBUILD
        working-directory: /tmp/aur-pkg
        env:
          PKGVER: ${{ steps.release.outputs.pkgver }}
          PKGREL: ${{ steps.release.outputs.pkgrel }}
          SHA_X86: ${{ steps.checksums.outputs.sha_x86 }}
          SHA_ARM: ${{ steps.checksums.outputs.sha_arm }}
          HAS_ARM: ${{ steps.checksums.outputs.has_arm }}
        run: |
          sed -i "s/^pkgver=.*/pkgver=${PKGVER}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=${PKGREL}/" PKGBUILD
          sed -i "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('${SHA_X86}')/" PKGBUILD

          if [ "$HAS_ARM" == "true" ]; then
            sed -i "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('${SHA_ARM}')/" PKGBUILD
          else
            sed -i "/^[[:space:]]*'aarch64'/d" PKGBUILD
            sed -i "/^source_aarch64=/d" PKGBUILD
            sed -i "/^sha256sums_aarch64=/d" PKGBUILD
          fi

      - name: Generate .SRCINFO
        working-directory: /tmp/aur-pkg
        run: |
          docker run --rm -v "$(pwd):/pkg" archlinux:base-devel bash -c \
            "useradd -m -u $(id -u) builder && chown -R builder:builder /pkg && su builder -c 'cd /pkg && makepkg --printsrcinfo > .SRCINFO'"

      - name: Push to AUR
        working-directory: /tmp/aur-pkg
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "GitHub Actions (GektusVPN)"
          git add PKGBUILD .SRCINFO
          if ! git diff --cached --quiet; then
            git commit -m "Update to $GITHUB_REF_NAME"
            git push
          fi

  notify:
    needs: [upload, aur-publish]
    if: >-
      always() &&
      vars.SEND_TELEGRAM == 'true' &&
      needs.upload.result == 'success' &&
      (needs.aur-publish.result == 'success' || needs.aur-publish.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download release notes
        uses: actions/download-artifact@v6
        with:
          name: release-notes

      - name: Prepare commit list for notification
        id: prepare_commits
        run: |
          main_commit=$(git log -1 --pretty=format:"%s" ${{ github.ref_name }})
          other_commits=$(head -n 20 release.md | grep "^- " | grep -v "^- ${main_commit}$" | head -n 9)
          commits="• ${main_commit}"
          if [ -n "$other_commits" ]; then
            commits="${commits}"$'\n'"${other_commits}"
          fi
          commits_escaped=$(echo "$commits" | jq -Rs .)
          echo "commits=$commits_escaped" >> $GITHUB_OUTPUT

      - name: Send Telegram notifications
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERSION: ${{ github.ref_name }}
          COMMITS: ${{ fromJSON(steps.prepare_commits.outputs.commits) }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
          IS_STABLE: ${{ env.IS_STABLE }}
        run: |
          python3 -m pip install requests --quiet
          python3 .github/scripts/notify_telegram.py
